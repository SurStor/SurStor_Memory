name: Publish MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      IMAGE: ghcr.io/surstor/surstor-memory:0.2.0-alpha.3-mcp.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build labeled image from pinned runtime
        run: docker build --platform linux/amd64 -f docker/registry.Dockerfile -t surstor-ci .
      - name: Test MCP, persistence, search and encryption
        run: python3 docker/smoke_test.py surstor-ci
      - name: Test encrypted sync
        run: python3 docker/sync_smoke_test.py surstor-ci
      - name: Publish labeled image
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag surstor-ci "$IMAGE"
          docker push "$IMAGE"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Install verified MCP publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate and publish listing
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate server.json
          ./mcp-publisher publish server.json
      - name: Logout of GHCR
        if: always()
        run: docker logout ghcr.io
