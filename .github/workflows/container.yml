name: Publish container
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.2.0-alpha.2
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          lfs: false
          persist-credentials: false
      - name: Validate release and download verified runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 docker/release_artifacts.py
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          keyfile=$(mktemp)
          SURSTOR_KEY_FILE="$keyfile" docker compose -f compose.encrypted.yaml config --quiet
          rm "$keyfile"
      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 -t surstor-ci .
      - name: Test containers before publishing
        run: python3 docker/smoke_test.py surstor-ci
      - name: Publish versioned image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/surstor/surstor-memory:${RELEASE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag surstor-ci "$IMAGE"
          docker push "$IMAGE"
          echo "Published $IMAGE (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      - name: Logout
        if: always()
        run: docker logout ghcr.io
