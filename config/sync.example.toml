# Append this section to an existing node config. See docs/node-sync.md.
# Available in alpha.3; disabled until explicitly configured.
[sync]
enabled = false
port = 8485
interval_seconds = 15
token_file = "sync.token"
sessions = "shared-memory"
trusted_signers = "REPLACE_WITH_COMMA_SEPARATED_PUBLIC_KEYS"
peers = "http://127.0.0.1:18485"
